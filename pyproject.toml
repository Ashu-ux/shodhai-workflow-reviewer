[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shodhai-workflow-reviewer"
version = "1.0.0"
description = "AI-Assisted Workflow Reviewer for Policy Routing Systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ashutosh Kumar", email = "candidate@shodh.ai"}
]
keywords = ["workflow", "reviewer", "semantic-analysis", "ast", "verification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typing_extensions>=4.10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
